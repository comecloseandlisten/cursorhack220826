<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Семья — полотно</title>
<style>
  :root{
    --paper:#F7F5F0;
    --ink:#191712;
    --soft:#8a8478;
    --hair:#d6d1c6;
    --hair-strong:#b8b2a5;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;background:var(--paper);color:var(--ink);
    font-family:ui-sans-serif,-apple-system,"Helvetica Neue",Arial,sans-serif;
    overflow:hidden;-webkit-font-smoothing:antialiased}

  #viewport{position:fixed;inset:0;cursor:grab}
  #viewport.dragging{cursor:grabbing}
  #world{position:absolute;top:0;left:0;transform-origin:0 0;will-change:transform}

  /* ---------- day board ---------- */
  .day{position:absolute;top:0;width:1500px;height:900px}
  .day-head{position:absolute;left:60px;top:44px}
  .date{font-size:76px;font-weight:200;letter-spacing:.14em;line-height:1;white-space:nowrap}
  .date .y{color:var(--soft);font-size:24px;letter-spacing:.3em;margin-left:18px;vertical-align:8px}
  .dayline{margin-top:14px;font-size:15px;color:var(--soft);font-style:italic;max-width:640px;font-family:Georgia,"Times New Roman",serif}

  /* ---------- person blob ---------- */
  .blob{position:absolute;border:1px solid var(--hair);padding:44px 52px;min-height:250px}
  .blob.absent{border-style:dashed;border-color:var(--hair-strong)}
  .name{font-size:11px;letter-spacing:.26em;color:var(--soft);text-transform:uppercase;white-space:nowrap}
  .summary{margin-top:10px;font-family:Georgia,"Times New Roman",serif;font-style:italic;
    font-size:13.5px;line-height:1.6;color:#5f594e;max-width:330px}

  .marks{margin-top:16px;display:flex;flex-wrap:wrap;gap:5px;width:250px}
  .marks i{width:4px;height:4px;background:#3a352c;border-radius:50%;display:block}

  .stream{margin-top:18px;display:none}
  .msg{display:flex;gap:16px;margin-bottom:13px;align-items:baseline}
  .t{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:10px;color:#b3ada0;
    min-width:34px;text-align:right;padding-top:3px;flex:none}
  .txt{font-family:Georgia,"Times New Roman",serif;font-size:14.5px;line-height:1.62;
    color:#2a251d;max-width:330px}
  .photo{width:200px;height:132px;margin:4px 0 6px;background:#e6e0d4;
    background-size:cover;background-position:center;flex:none}
  .wave{display:flex;align-items:flex-end;gap:2px;height:22px;margin:6px 0}
  .wave span{width:2px;background:#a49d8f;display:block}
  .dur{font-family:ui-monospace,Menlo,monospace;font-size:10px;color:#b3ada0;margin-left:8px}

  .ask{margin-top:18px;font-family:Georgia,serif;font-style:italic;font-size:13px;color:#8a8478;
    border-top:1px solid var(--hair);padding-top:12px;max-width:280px}

  /* ---------- echo (год назад) ---------- */
  .echo{opacity:.32}
  .echo .date{font-size:34px}
  .echo-label{position:absolute;left:60px;font-size:10px;letter-spacing:.3em;color:var(--soft);
    text-transform:uppercase}
  .thread{position:absolute;width:1px;background:var(--hair)}

  /* ---------- LOD ---------- */
  #world.near .stream{display:block}
  #world.near .marks{display:none}
  /* вблизи человек перестаёт быть блобом и становится колонкой письма */
  #world.near .blob{
    left:var(--cx)!important;top:210px!important;width:390px!important;
    min-height:0;height:auto;border-radius:0!important;border-color:transparent;
    padding:0 26px;background:var(--paper)}
  #world.near .blob.absent{border-color:transparent}
  #world.near .summary{border-bottom:1px solid var(--hair);padding-bottom:14px;margin-bottom:22px}
  #world.mid .marks{display:flex}
  #world.far .summary,#world.far .ask{display:none}
  #world.far .date{font-size:120px}
  #world.far .blob{padding:18px 20px}

  /* ---------- chrome ---------- */
  #zoom{position:fixed;top:26px;right:34px;text-align:right;pointer-events:none}
  #zoom .lvl{font-size:10px;letter-spacing:.28em;color:var(--soft);text-transform:uppercase}
  #zoom .scale{font-family:ui-monospace,Menlo,monospace;font-size:10px;color:#b8b2a5;margin-top:6px}

  #rail{position:fixed;left:0;right:0;bottom:0;height:56px;display:flex;align-items:center;
    gap:0;padding:0 34px;background:linear-gradient(to top,var(--paper) 62%,rgba(247,245,240,0));}
  #rail .tick{flex:1;height:26px;display:flex;flex-direction:column;align-items:center;
    justify-content:flex-end;cursor:pointer}
  #rail .tick s{width:1px;height:9px;background:var(--hair-strong);text-decoration:none;display:block}
  #rail .tick.on s{height:16px;background:var(--ink)}
  #rail .tick em{font-family:ui-monospace,Menlo,monospace;font-size:9px;color:#c2bcae;
    font-style:normal;margin-bottom:5px;opacity:0}
  #rail .tick.on em{opacity:1;color:var(--ink)}
  #rail .tick:hover em{opacity:1}

  #hint{position:fixed;left:34px;bottom:64px;font-size:10px;letter-spacing:.18em;
    color:#c2bcae;text-transform:uppercase;pointer-events:none}
</style>
</head>
<body>
<div id="viewport"><div id="world"></div></div>

<div id="zoom"><div class="lvl" id="lvl">день</div><div class="scale" id="sc">100%</div></div>
<div id="rail"></div>
<div id="hint">колесо — зум · тяните — время · клик по человеку · esc — сегодня</div>

<script>
// ───────────────────────── данные ─────────────────────────
const MONTHS=["января","февраля","марта","апреля","мая","июня","июля","августа","сентября","октября","ноября","декабря"];

const PEOPLE=[
  {id:"mama", name:"Мама",         x:120,  y:230, w:400, r:"58% 42% 47% 53% / 44% 56% 44% 56%"},
  {id:"papa", name:"Папа",         x:600,  y:200, w:400, r:"47% 53% 62% 38% / 55% 41% 59% 45%"},
  {id:"nina", name:"Бабушка Нина", x:150,  y:560, w:400, r:"52% 48% 40% 60% / 60% 46% 54% 40%"},
  {id:"katya",name:"Катя",         x:620,  y:590, w:360, r:"63% 37% 55% 45% / 40% 60% 40% 60%"},
  {id:"oleg", name:"Олег",         x:1080, y:560, w:330, r:"44% 56% 51% 49% / 57% 43% 57% 43%"}
];

const POOL={
  mama:[["09:14","Доброе утро. Кофе уже сварила, на кухне солнце — из тех тихих утр, когда всё кажется возможным."],
        ["09:20","Встретилась с Эльвирой в нашей кофейне. Сидели долго, говорили обо всём и ни о чём."],
        ["11:47","Зашла на рынок. Взяла черешню, базилик и последний горошек."],
        ["12:30","Сделала тебе лимонную пасту на обед. Она никогда не надоедает."],
        ["13:02","Читаю прекрасную книгу, не хочу, чтобы кончалась."],
        ["18:40","Полила сад. Помидоры наконец пошли."],
        ["21:15","Гуляли с Ниной до моста и обратно."]],
  papa:[["08:02","Уехал раньше, на объезде пробки нет."],
        ["10:30","Созвон прошёл нормально, проект сдвинулся."],
        ["13:12","Обедал в столовой у работы, опять пельмени."],
        ["17:55","Купил уголь, вечером шашлык."],
        ["19:20","Дети во дворе гоняют мяч, я на террасе."],
        ["22:05","Посмотрел половину матча и уснул."]],
  nina:[["07:40","Проснулась в пять, как всегда. Слушала радио."],
        ["10:15","Дочитала книгу, которую ты привёз. Понравилась."],
        ["11:50","Помогала Ире на кухне, чистила горошек."],
        ["15:30","Приходила соседка, принесла сливы из деревни."],
        ["16:44","Нашла фотографию, где мы с Володей в Ялте. Не помню, какой это год."],
        ["20:10","Была в саду, розы этим летом лучше прошлого."]],
  katya:[["10:05","На рисовании делали комикс про кота-космонавта."],
        ["12:20","Мам, а можно мороженое?"],
        ["14:10","Дорисовала! Покажу вечером."],
        ["16:30","Читала бабушке вслух, она заснула на середине."],
        ["19:45","Завтра идём в бассейн?"]],
  oleg:[["11:20","Долетел, всё нормально."],
        ["21:30","Тут поздно, напишу завтра."]]
};

const SUMMARY={
  mama:"Тихий день: кофе с Эльвирой, рынок, паста на обед и сад к вечеру.",
  papa:"Работа с утра, вечером шашлык и дети во дворе.",
  nina:"Дочитала книгу, нашла старое фото Ялты, вечером розы.",
  katya:"Рисовала комикс, читала бабушке вслух.",
  oleg:""
};

const DAYLINE=[
  "Тёплый день. Все дома, кроме Олега.",
  "Дождь с утра, к вечеру разъяснилось.",
  "Ничего особенного — и это хорошо.",
  "Долгий разговор на кухне, который никто не записал.",
  "Катя впервые дочитала книгу до конца."
];

const PHOTOS=[
  "linear-gradient(150deg,#c8a882,#8a6f4e)",
  "linear-gradient(160deg,#9fb08c,#5d6f52)",
  "linear-gradient(140deg,#d0b7a0,#9a7f68)",
  "linear-gradient(170deg,#b9c3cc,#7e8b96)",
  "linear-gradient(135deg,#d8c48f,#a8894f)"
];

// детерминированный «рандом», чтобы полотно не дёргалось между перерисовками
function rnd(seed){let x=Math.sin(seed*127.1)*43758.5453;return x-Math.floor(x)}

const DAYS=30;            // сколько дней вправо-влево от сегодня
const DAY_W=1500;
const ECHO_Y=1080;
const TODAY=new Date(2026,7,22);

function dateFor(offset){const d=new Date(TODAY);d.setDate(d.getDate()+offset);return d}

function messagesFor(pid,offset){
  const pool=POOL[pid], seed=Math.abs(offset)*7.3+pid.length*3.1;
  if(pid==="oleg"&&offset>=-3&&offset<=0) return [];   // Олег молчит четвёртый день
  if(offset===0) return pool;
  const n=Math.max(0,Math.round(rnd(seed)*pool.length));
  return pool.slice(0,n);
}

// ───────────────────────── рендер ─────────────────────────
const world=document.getElementById("world");
const vp=document.getElementById("viewport");
let html="";

for(let off=-DAYS;off<=DAYS;off++){
  const d=dateFor(off);
  const x=off*DAY_W;
  html+=`<div class="day" style="left:${x}px">`;
  html+=`<div class="day-head"><div class="date">${d.getDate()} ${MONTHS[d.getMonth()]}`
      + (off===0?`<span class="y">сегодня</span>`:``) + `</div>`
      + `<div class="dayline">${DAYLINE[Math.floor(rnd(off*3.7)*DAYLINE.length)]}</div></div>`;
  html+=people(off,false);
  html+=`</div>`;

  // эхо: тот же день годом раньше
  const e=new Date(d); e.setFullYear(d.getFullYear()-1);
  html+=`<div class="day echo" style="left:${x}px;top:${ECHO_Y}px">`
      + `<div class="echo-label" style="top:8px">год назад</div>`
      + `<div class="day-head" style="top:34px"><div class="date">${e.getDate()} ${MONTHS[e.getMonth()]}`
      + `<span class="y">${e.getFullYear()}</span></div></div>`
      + people(off,true)
      + `</div>`;
  html+=`<div class="thread" style="left:${x+150}px;top:900px;height:${ECHO_Y-900}px"></div>`;
}

function people(off,isEcho){
  let s="";
  for(const [i,p] of PEOPLE.entries()){
    const msgs=messagesFor(p.id,isEcho?off+180:off);
    const absent=msgs.length===0;
    const top=(isEcho?p.y*0.55+120:p.y);
    s+=`<div class="blob${absent?" absent":""}" data-p="${p.id}" data-off="${off}"
          style="left:${p.x}px;top:${top}px;width:${p.w}px;border-radius:${p.r};--cx:${70+i*440}px">`;
    s+=`<div class="name">${p.name}</div>`;
    if(!absent && SUMMARY[p.id] && off===0 && !isEcho)
      s+=`<div class="summary">${SUMMARY[p.id]}</div>`;
    else if(!absent)
      s+=`<div class="summary">${msgs.length} сообщени${msgs.length===1?"е":"й"} за день</div>`;

    s+=`<div class="marks">`+msgs.map(()=>`<i></i>`).join("")+`</div>`;

    s+=`<div class="stream">`;
    msgs.forEach((m,i)=>{
      s+=`<div class="msg"><div class="t">${m[0]}</div><div class="txt">${m[1]}</div></div>`;
      if(i===1) s+=`<div class="photo" style="background-image:${PHOTOS[(i+p.name.length)%PHOTOS.length]}"></div>`;
      if(i===3&&p.id==="mama"){
        let bars="";for(let k=0;k<46;k++)bars+=`<span style="height:${4+Math.round(rnd(k*2.7)*18)}px"></span>`;
        s+=`<div class="msg"><div class="t">12:46</div><div><div class="wave">${bars}</div></div><div class="dur">0:47</div></div>`;
      }
    });
    s+=`</div>`;

    if(absent) s+=`<div class="ask">Олег молчит четвёртый день. Спроси, как он долетел.</div>`;
    s+=`</div>`;
  }
  return s;
}

world.innerHTML=html;

// ───────────────────────── зум и панорама ─────────────────────────
let scale=1, tx=0, ty=0;
const MIN=.12, MAX=2.6;

function apply(anim){
  world.style.transition = anim ? "transform .55s cubic-bezier(.22,.8,.2,1)" : "none";
  world.style.transform  = `translate(${tx}px,${ty}px) scale(${scale})`;
  const lod = scale<.4 ? "far" : (scale<1.15 ? "mid" : "near");
  world.className = lod;
  document.getElementById("lvl").textContent = {far:"год",mid:"день",near:"человек"}[lod];
  document.getElementById("sc").textContent  = Math.round(scale*100)+"%";
  markRail();
}

function centerOn(wx,wy,s,anim=true){
  scale=Math.max(MIN,Math.min(MAX,s));
  tx=innerWidth/2-wx*scale;
  ty=innerHeight/2-wy*scale;
  apply(anim);
}

vp.addEventListener("wheel",e=>{
  e.preventDefault();
  const f=Math.exp(-e.deltaY*0.0016);
  const ns=Math.max(MIN,Math.min(MAX,scale*f));
  const wx=(e.clientX-tx)/scale, wy=(e.clientY-ty)/scale;
  scale=ns; tx=e.clientX-wx*scale; ty=e.clientY-wy*scale;
  apply(false);
},{passive:false});

let drag=null;
vp.addEventListener("pointerdown",e=>{
  drag={x:e.clientX,y:e.clientY,tx,ty,moved:false};
  vp.classList.add("dragging"); vp.setPointerCapture(e.pointerId);
});
vp.addEventListener("pointermove",e=>{
  if(!drag)return;
  tx=drag.tx+(e.clientX-drag.x); ty=drag.ty+(e.clientY-drag.y);
  if(Math.abs(e.clientX-drag.x)+Math.abs(e.clientY-drag.y)>4)drag.moved=true;
  apply(false);
});
vp.addEventListener("pointerup",e=>{
  const wasDrag=drag&&drag.moved; drag=null; vp.classList.remove("dragging");
  if(wasDrag)return;
  const blob=e.target.closest(".blob");
  if(blob){
    const r=blob.getBoundingClientRect();
    centerOn((r.left+r.width/2-tx)/scale,(r.top+r.height/2-ty)/scale,1.7);
  }
});

addEventListener("keydown",e=>{
  if(e.key==="Escape") goHome();
  if(e.key==="1") centerOn(0+DAY_W/2,ECHO_Y/2,.22);
  if(e.key==="2") goHome();
  if(e.key==="3") centerOn(320,420,1.9);
});

function goHome(){ centerOn(DAY_W/2-140,470,.9) }

// ───────────────────────── нижняя шкала дней ─────────────────────────
const rail=document.getElementById("rail");
let railHtml="";
for(let off=-14;off<=14;off++){
  const d=dateFor(off);
  railHtml+=`<div class="tick" data-off="${off}"><em>${d.getDate()}</em><s></s></div>`;
}
rail.innerHTML=railHtml;
rail.querySelectorAll(".tick").forEach(t=>{
  t.onclick=()=>{const off=+t.dataset.off; centerOn(off*DAY_W+DAY_W/2-140,470,Math.max(scale,.9))};
});
function markRail(){
  const centerWorldX=(innerWidth/2-tx)/scale;
  const off=Math.round((centerWorldX-DAY_W/2+140)/DAY_W);
  rail.querySelectorAll(".tick").forEach(t=>t.classList.toggle("on",+t.dataset.off===off));
}

goHome();
</script>
</body>
</html>
