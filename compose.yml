name: cursorhack-local

services:
  mongo:
    image: mongo:8.0
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mongosh --quiet --eval \"quit(db.adminCommand('ping').ok ? 0 : 2)\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3000"
      CORS_ORIGIN: http://localhost:${WEB_PORT:-8080}
      MONGODB_URI: mongodb://mongo:27017/cursorhack
      BOT_TOKEN: ${BOT_TOKEN:-dev-bot-token}
      PUBLIC_BASE_URL: http://localhost:${WEB_PORT:-8080}
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "--fail",
          "--silent",
          "--show-error",
          "http://127.0.0.1:3000/api/health",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--spider",
          "http://127.0.0.1/healthz",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  bot:
    build:
      context: .
      dockerfile: apps/bot/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HEALTH_PORT: "3001"
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      DIGEST_API_BASE_URL: http://api:3000/api/v1
      DIGEST_BOT_TOKEN: ${BOT_TOKEN:-dev-bot-token}
      DEFAULT_CANVAS_ID: ${DEFAULT_CANVAS_ID:-canvas_default}
      CHAT_CANVAS_MAP: ${CHAT_CANVAS_MAP:-}
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/').then((r)=>process.exit(r.ok?0:1),()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s

volumes:
  mongo_data:
